<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جروبات السكاشن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f6f4; --ink:#12302b; --muted:#5d7772; --card:#ffffff; --line:#d5e0dc;
    --accent:#0f6b5c; --accent-ink:#ffffff; --off:#e6ecea; --off-ink:#8ea39e;
    --danger:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1917; --ink:#e4f0ed; --muted:#8fa9a3; --card:#15251f; --line:#25403a;
      --accent:#2fb59b; --accent-ink:#06211c; --off:#1a2b27; --off-ink:#587069;
      --danger:#e5776a;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
    padding:env(safe-area-inset-top,0) 16px calc(env(safe-area-inset-bottom,0px) + 90px);
    min-height:100vh;
  }
  main{max-width:640px;margin:0 auto;padding-top:32px}
  h1{font-size:2rem;font-weight:800;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 28px;line-height:1.7}
  .group{margin-bottom:26px}
  .group h2{
    font-size:1.05rem;font-weight:800;margin:0 0 10px;
    padding-inline-start:12px;border-inline-start:4px solid var(--accent);
  }
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .sec{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:76px;border-radius:14px;text-decoration:none;
    font-weight:800;font-size:1.35rem;letter-spacing:.5px;
    border:1.5px solid var(--line);
  }
  a.sec{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  a.sec small{font-weight:600;font-size:.72rem;opacity:.85;margin-top:2px}
  a.sec:active{transform:scale(.97)}
  a.sec:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .sec.off{background:var(--off);color:var(--off-ink);border-style:dashed;cursor:not-allowed}
  .sec.off small{font-weight:600;font-size:.72rem;margin-top:2px}
  .lectures-grid{grid-template-columns:1fr}
  .lectures-grid .sec{font-size:1.1rem;padding:10px 16px}

  /* ---- admin fab ---- */
  #admin-fab{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;
    padding:11px 20px;border-radius:999px;
    background:var(--accent);color:var(--accent-ink);
    border:none;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:.9rem;
    box-shadow:0 4px 16px rgba(0,0,0,.22);
    z-index:40; transition:transform .15s ease, box-shadow .15s ease;
  }
  #admin-fab:active{transform:translateX(-50%) scale(.96)}
  #admin-fab svg{width:18px;height:18px;flex:0 0 auto;display:block}

  /* ---- modal overlay ---- */
  #admin-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.45);
    display:none;align-items:flex-start;justify-content:center;
    padding:env(safe-area-inset-top,0px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
    overflow-y:auto; z-index:50;
  }
  #admin-overlay.open{display:flex}
  .admin-box{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    max-width:520px;width:100%;padding:22px;margin-top:40px;margin-bottom:40px;
  }
  .admin-box h3{margin:0 0 16px;font-size:1.2rem;font-weight:800}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input{
    width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--bg);color:var(--ink);font-family:inherit;font-size:1rem;
  }
  .field input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 18px;border-radius:10px;border:none;font-weight:800;
    font-family:inherit;font-size:.95rem;cursor:pointer;
  }
  .btn-main{background:var(--accent);color:var(--accent-ink);width:100%}
  .btn-ghost{background:var(--off);color:var(--ink)}
  .btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
  .admin-actions{display:flex;gap:10px;margin-top:18px}
  .err{color:var(--danger);font-size:.85rem;margin-top:-6px;margin-bottom:12px;min-height:1em}
  .msg{font-size:.85rem;margin-top:10px;min-height:1em}
  .msg.ok{color:var(--accent)}
  .msg.bad{color:var(--danger)}
  .close-x{
    position:absolute;top:14px;left:14px;background:none;border:none;
    font-size:1.4rem;color:var(--muted);cursor:pointer;line-height:1;
  }
  .admin-box{position:relative}
  .edit-row{
    display:flex;align-items:center;gap:8px;margin-bottom:10px;
  }
  .edit-row .tag{
    flex:0 0 64px;font-weight:800;font-size:.95rem;text-align:center;
  }
  .edit-row input{flex:1}
  .edit-row button{
    flex:0 0 auto;background:var(--off);color:var(--ink);border:none;
    border-radius:8px;padding:9px 10px;font-size:.85rem;cursor:pointer;font-weight:700;
  }
  .edit-group-title{font-weight:800;margin:18px 0 8px;font-size:.95rem;color:var(--muted)}
  .top-actions{display:flex;gap:10px;margin-bottom:16px}
  .top-actions .btn{flex:1}
</style>
</head>
<body>
<main>
  <h1>جروبات المحاضرات</h1>
  <p class="sub">اضغط على اسم الجروب وهيفتحلك جروب الواتساب مباشرة.</p>
  <div id="lectures"></div>

  <h1>جروبات السكاشن</h1>
  <p class="sub">اضغط على اسم السكشن بتاعك وهيفتحلك جروب الواتساب مباشرة.</p>
  <div id="app"></div>
</main>

<button type="button" id="admin-fab" title="لوحة المشرف">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="5" y="11" width="14" height="10" rx="2.2" stroke="currentColor" stroke-width="2"/>
    <path d="M8 11V7.5a4 4 0 0 1 8 0V11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="15.5" r="1.4" fill="currentColor"/>
  </svg>
  <span>لوحة المشرف</span>
</button>

<div id="admin-overlay">
  <div class="admin-box">
    <button class="close-x" id="admin-close">×</button>

    <div id="login-view">
      <h3>تسجيل دخول المشرف</h3>
      <div class="field">
        <label>اسم المستخدم</label>
        <input type="text" id="login-user" autocomplete="off">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="login-pass" autocomplete="off">
      </div>
      <div class="err" id="login-err"></div>
      <button class="btn btn-main" id="login-btn">دخول</button>
    </div>

    <div id="panel-view" style="display:none">
      <h3>لوحة المشرف</h3>
      <div class="top-actions">
        <button class="btn btn-main" id="save-btn">حفظ التغييرات</button>
        <button class="btn btn-ghost" id="logout-btn">تسجيل خروج</button>
      </div>
      <div id="edit-fields"></div>
      <div class="msg" id="save-msg"></div>
    </div>
  </div>
</div>

<script type="application/json" id="data-json">

<script>
(function(){
  "use strict";

  const ADMIN_USER = "Anas Elsayed";
  const ADMIN_PASS = "291007";

  // Capture the pristine document HTML (before any dynamic rendering runs)
  // so admin saves can regenerate a clean, publishable copy of the page.
  const PRISTINE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  let DATA;
  try {
    DATA = JSON.parse(document.getElementById('data-json').textContent);
  } catch (e) {
    DATA = { lectures: [], groups: {} };
  }

  function renderTile(name, url) {
    let el;
    if (url) {
      el = document.createElement('a');
      el.href = url;
      el.target = '_blank';
      el.rel = 'noopener noreferrer';
      el.innerHTML = name + '<small>انضم للجروب</small>';
    } else {
      el = document.createElement('div');
      el.setAttribute('aria-disabled', 'true');
      el.innerHTML = name + '<small>قريبًا</small>';
    }
    el.className = 'sec' + (url ? '' : ' off');
    return el;
  }

  function renderAll() {
    const lecturesEl = document.getElementById('lectures');
    lecturesEl.innerHTML = '';
    const lgrid = document.createElement('div');
    lgrid.className = 'grid lectures-grid';
    (DATA.lectures || []).forEach(item => {
      lgrid.appendChild(renderTile(item.name, item.url));
    });
    lecturesEl.appendChild(lgrid);

    const app = document.getElementById('app');
    app.innerHTML = '';
    Object.entries(DATA.groups || {}).forEach(([group, items]) => {
      const wrap = document.createElement('section');
      wrap.className = 'group';
      wrap.innerHTML = '<h2>مجموعة ' + group + '</h2>';
      const grid = document.createElement('div');
      grid.className = 'grid';
      Object.entries(items).forEach(([name, url]) => {
        grid.appendChild(renderTile(name, url));
      });
      wrap.appendChild(grid);
      app.appendChild(wrap);
    });
  }

  renderAll();

  // ---------------- Admin panel ----------------
  const overlay = document.getElementById('admin-overlay');
  const fab = document.getElementById('admin-fab');
  const closeX = document.getElementById('admin-close');
  const loginView = document.getElementById('login-view');
  const panelView = document.getElementById('panel-view');
  const loginUser = document.getElementById('login-user');
  const loginPass = document.getElementById('login-pass');
  const loginErr = document.getElementById('login-err');
  const loginBtn = document.getElementById('login-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const saveBtn = document.getElementById('save-btn');
  const saveMsg = document.getElementById('save-msg');
  const editFields = document.getElementById('edit-fields');

  function isAdmin() {
    return sessionStorage.getItem('isAdmin') === '1';
  }

  function openOverlay() {
    overlay.classList.add('open');
    if (isAdmin()) {
      showPanel();
    } else {
      showLogin();
    }
  }
  function closeOverlay() {
    overlay.classList.remove('open');
  }
  function showLogin() {
    loginView.style.display = '';
    panelView.style.display = 'none';
    loginErr.textContent = '';
    loginUser.value = '';
    loginPass.value = '';
  }
  function showPanel() {
    loginView.style.display = 'none';
    panelView.style.display = '';
    buildEditFields();
    saveMsg.textContent = '';
    saveMsg.className = 'msg';
  }

  function buildEditFields() {
    editFields.innerHTML = '';

    const lecTitle = document.createElement('div');
    lecTitle.className = 'edit-group-title';
    lecTitle.textContent = 'جروبات المحاضرات';
    editFields.appendChild(lecTitle);

    (DATA.lectures || []).forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'edit-row';
      row.innerHTML =
        '<span class="tag">' + item.name + '</span>' +
        '<input type="text" data-kind="lecture" data-idx="' + idx + '" value="' + (item.url || '').replace(/"/g,'&quot;') + '" placeholder="رابط الجروب">' +
        '<button type="button" data-clear-kind="lecture" data-clear-idx="' + idx + '">مسح</button>';
      editFields.appendChild(row);
    });

    Object.entries(DATA.groups || {}).forEach(([group, items]) => {
      const gTitle = document.createElement('div');
      gTitle.className = 'edit-group-title';
      gTitle.textContent = 'مجموعة ' + group;
      editFields.appendChild(gTitle);

      Object.entries(items).forEach(([name]) => {
        const row = document.createElement('div');
        row.className = 'edit-row';
        row.innerHTML =
          '<span class="tag">' + name + '</span>' +
          '<input type="text" data-kind="section" data-group="' + group + '" data-name="' + name + '" value="' + (items[name] || '').replace(/"/g,'&quot;') + '" placeholder="رابط الجروب">' +
          '<button type="button" data-clear-kind="section" data-clear-group="' + group + '" data-clear-name="' + name + '">مسح</button>';
        editFields.appendChild(row);
      });
    });
  }

  editFields && editFields.addEventListener('click', function(e){
    const btn = e.target.closest('button[data-clear-kind]');
    if (!btn) return;
    const kind = btn.getAttribute('data-clear-kind');
    if (kind === 'lecture') {
      const idx = btn.getAttribute('data-clear-idx');
      const input = editFields.querySelector('input[data-kind="lecture"][data-idx="' + idx + '"]');
      if (input) input.value = '';
    } else {
      const group = btn.getAttribute('data-clear-group');
      const name = btn.getAttribute('data-clear-name');
      const input = editFields.querySelector('input[data-kind="section"][data-group="' + group + '"][data-name="' + name + '"]');
      if (input) input.value = '';
    }
  });

  fab.addEventListener('click', openOverlay);
  closeX.addEventListener('click', closeOverlay);
  overlay.addEventListener('click', function(e){ if (e.target === overlay) closeOverlay(); });

  loginBtn.addEventListener('click', function(){
    if (loginUser.value === ADMIN_USER && loginPass.value === ADMIN_PASS) {
      sessionStorage.setItem('isAdmin', '1');
      showPanel();
    } else {
      loginErr.textContent = 'اسم المستخدم أو كلمة المرور غلط.';
    }
  });
  loginPass.addEventListener('keydown', function(e){ if (e.key === 'Enter') loginBtn.click(); });

  logoutBtn.addEventListener('click', function(){
    sessionStorage.removeItem('isAdmin');
    closeOverlay();
  });

  function collectDataFromFields() {
    const newData = { lectures: [], groups: {} };
    (DATA.lectures || []).forEach((item, idx) => {
      const input = editFields.querySelector('input[data-kind="lecture"][data-idx="' + idx + '"]');
      newData.lectures.push({ name: item.name, url: input ? input.value.trim() : item.url });
    });
    Object.entries(DATA.groups || {}).forEach(([group, items]) => {
      newData.groups[group] = {};
      Object.keys(items).forEach(name => {
        const input = editFields.querySelector('input[data-kind="section"][data-group="' + group + '"][data-name="' + name + '"]');
        newData.groups[group][name] = input ? input.value.trim() : items[name];
      });
    });
    return newData;
  }

  async function saveChanges() {
    const newData = collectDataFromFields();
    DATA = newData;
    renderAll();

    const newJson = JSON.stringify(DATA, null, 2);
    const newHtml = PRISTINE_HTML.replace(
      /(<script type="application\/json" id="data-json">)([\s\S]*?)(<\/script>)/,
      function(full, p1, p2, p3){ return p1 + '\n' + newJson + '\n' + p3; }
    );

    saveMsg.className = 'msg';
    saveMsg.textContent = 'جاري الحفظ...';

    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const artifactCap = await window.claude.use('artifact');
        if (artifactCap) {
          await artifactCap.publish(newHtml);
          saveMsg.className = 'msg ok';
          saveMsg.textContent = 'تم الحفظ، والتغيير هيظهر لكل اللي يفتحوا الرابط.';
          return;
        }
      }
      throw new Error('no-artifact-capability');
    } catch (err) {
      // Fallback: keep the change only in this browser so the admin
      // still sees it, and explain that it isn't shared to everyone.
      try { localStorage.setItem('localDataOverride', JSON.stringify(DATA)); } catch(e){}
      saveMsg.className = 'msg bad';
      saveMsg.textContent = 'اتحفظ في المتصفح ده بس. عشان يتحفظ لكل الطلاب لازم تفتح الرابط من حساب صاحب الصفحة الأصلي على claude.ai.';
    }
  }

  saveBtn.addEventListener('click', saveChanges);

  // On a locally-opened copy (no publish capability), still respect
  // any earlier local override so the admin's own browser stays in sync.
  if (!(window.claude && typeof window.claude.use === 'function')) {
    try {
      const override = localStorage.getItem('localDataOverride');
      if (override) {
        DATA = JSON.parse(override);
        renderAll();
      }
    } catch(e){}
  }
})();
</script>
</body>
</html>
